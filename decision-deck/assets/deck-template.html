<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DECK TITLE</title>
<!--
  Decision deck. Three layers, edited in this order:
    1. THEME   the Google Fonts link and the style block with id "theme": tokens, type, ground, hero motif. Rewritten for every deck.
    2. HERO    the figure with id "hero-visual": a visual drawn from the project's own subject. Rewritten for every deck.
    3. DATA    the JSON script block with id "deck-data": all words, options, questions, scoring and rules.
  The engine (the style block with id "engine" and the last script) is shared. Change it only to fix a bug or add a feature to the skill.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="theme">
/* THEME: default. Replace this whole block for every deck. See references/design.md. */
/* Concept: one line on where this look comes from (the customer, the subject, the room). */
:root {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #e8eaee; --ink: #15181e; --muted: #555c69; --rule: #d3d7de;
  --accent: #2d5bd7; --accent-ink: #ffffff; --accent-soft: #e2e9fb;
  /* One color per decision, in DATA order. */
  --d1: #2d5bd7; --d1-ink: #ffffff; --d1-soft: #e2e9fb;
  --d2: #8a3fb8; --d2-ink: #ffffff; --d2-soft: #f0e4f8;
  --d3: #0d7d6c; --d3-ink: #ffffff; --d3-soft: #dcf2ee;
  --good: #1c774b; --good-soft: #def1e6; --bad: #ad2a3b; --bad-soft: #f8e1e4; --warn: #855700; --warn-soft: #f8edd3;
  /* The result panel. Dark by default so the recommendation reads as an instrument readout. */
  --panel-bg: #12151b; --panel-fg: #e6e9ee; --panel-muted: #98a0ad; --panel-rule: #262b35; --panel-track: #1d222b; --panel-tint: #171b22;
  --panel-d1: #7fa2ff; --panel-d2: #cf97f5; --panel-d3: #5fd3bf; --panel-bad: #ff8d98;
  --font-display: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display-weight: 700; --display-stretch: 100%; --display-tracking: -0.02em;
  --r: 6px;
  --ground: none; --ground-size: auto;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1014; --surface: #161a20; --surface-2: #1e232b; --ink: #e3e6eb; --muted: #9aa2ae; --rule: #2a303a;
    --accent: #7fa2ff; --accent-ink: #0a1430; --accent-soft: #18233f;
    --d1: #7fa2ff; --d1-ink: #0a1430; --d1-soft: #18233f;
    --d2: #cf97f5; --d2-ink: #21082f; --d2-soft: #2a1838;
    --d3: #5fd3bf; --d3-ink: #04201b; --d3-soft: #102c27;
    --good: #6fd39a; --good-soft: #13301f; --bad: #ff8d98; --bad-soft: #3a1a1f; --warn: #eec36a; --warn-soft: #352a12;
    --panel-bg: #08090c; --panel-rule: #20252e; --panel-track: #181c23; --panel-tint: #0f1216;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014; --surface: #161a20; --surface-2: #1e232b; --ink: #e3e6eb; --muted: #9aa2ae; --rule: #2a303a;
  --accent: #7fa2ff; --accent-ink: #0a1430; --accent-soft: #18233f;
  --d1: #7fa2ff; --d1-ink: #0a1430; --d1-soft: #18233f;
  --d2: #cf97f5; --d2-ink: #21082f; --d2-soft: #2a1838;
  --d3: #5fd3bf; --d3-ink: #04201b; --d3-soft: #102c27;
  --good: #6fd39a; --good-soft: #13301f; --bad: #ff8d98; --bad-soft: #3a1a1f; --warn: #eec36a; --warn-soft: #352a12;
  --panel-bg: #08090c; --panel-rule: #20252e; --panel-track: #181c23; --panel-tint: #0f1216;
}
/* Hero motif styles go here (the figure's own classes), so the engine never needs them. */
.hero-visual svg { display: block; width: 100%; height: auto; }
</style>
<style id="engine">
/* Engine layout. Uses only theme tokens. Shared by every deck; don't restyle per deck here. */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body {
  margin: 0; background-color: var(--bg); background-image: var(--ground); background-size: var(--ground-size);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { line-height: 1.1; text-wrap: balance; }
h1 { font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1; }
h2 { font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); font-size: clamp(1.6rem, 3.2vw, 2.3rem); }
h3 { font-size: 1.02rem; font-weight: 600; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--accent)); flex: none; }
.lede { color: var(--muted); font-size: 1.06rem; max-width: 64ch; }
.kbd { font-family: var(--font-mono); font-size: 0.78em; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface); }
[data-d="1"] { --dc: var(--d1); --dc-ink: var(--d1-ink); --dc-soft: var(--d1-soft); --pc: var(--panel-d1); }
[data-d="2"] { --dc: var(--d2); --dc-ink: var(--d2-ink); --dc-soft: var(--d2-soft); --pc: var(--panel-d2); }
[data-d="3"] { --dc: var(--d3); --dc-ink: var(--d3-ink); --dc-soft: var(--d3-soft); --pc: var(--panel-d3); }

/* Bar */
.bar { position: sticky; top: 0; z-index: 30; height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); font-size: 1rem; white-space: nowrap; color: inherit; text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.brand span { color: var(--muted); font-family: var(--font-body); font-stretch: 100%; font-weight: 500; font-size: 0.9rem; }
.bar-mid { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.bar-mid .pn { min-width: 6ch; text-align: center; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.bar-end { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
.count { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.iconbtn { appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; width: 34px; height: 34px; border-radius: var(--r); cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn:hover, .iconbtn[aria-pressed="true"] { border-color: var(--rule); background: var(--surface-2); }
.iconbtn:disabled { opacity: 0.3; cursor: default; background: transparent; border-color: transparent; }
.iconbtn svg { width: 18px; height: 18px; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
@media (max-width: 560px) { .brand span { display: none; } .count { display: none; } }

/* Stage and slides */
.stage { max-width: 1320px; margin: 0 auto; padding: clamp(24px, 5vh, 52px) 16px 64px; }
@media (min-width: 700px) { .stage { padding-left: 32px; padding-right: 32px; } }
/* A large scroll margin keeps the browser's own #anchor jump at the top of the page. */
.slide { display: none; flex-direction: column; gap: 26px; min-width: 0; min-height: calc(100vh - 56px - 120px); scroll-margin-top: 100vh; }
.slide.active { display: flex; animation: enter 0.2s ease both; }
.slide > aside { display: none; }
@keyframes enter { from { opacity: 0.5; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.slide-head { display: flex; flex-direction: column; gap: 12px; }
.slide-body { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
.slidenav { margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); }
.slidenav .spacer { flex: 1; }
.btn { appearance: none; font: inherit; font-size: 0.9rem; font-weight: 600; padding: 9px 16px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn small { font-family: var(--font-mono); font-size: 0.76rem; font-weight: 400; opacity: 0.75; }

/* Intro */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: center; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-visual { margin: 0; min-width: 0; }
.home-group { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.howto { color: var(--muted); font-size: 0.86rem; }
.order { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.order button { appearance: none; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 2px; cursor: pointer; align-content: start; transition: background 0.12s ease; }
.order button:hover { background: var(--accent-soft); }
.order .onum { grid-row: 1 / span 3; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.order button.complete .onum { color: var(--good); }
.order button.complete .onum::after { content: " \2713"; }
.order b { font-weight: 600; }
.order span { color: var(--muted); font-size: 0.85rem; }
.order em { font-style: normal; color: var(--muted); font-size: 0.72rem; font-family: var(--font-mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.refs { display: grid; gap: 10px; }
.refs button { appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--good); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; }
.refs button:hover { background: var(--accent-soft); }
.refs span { color: var(--muted); font-size: 0.85rem; flex: 1; min-width: 12rem; }

/* Area slides: one ruled sheet, a row per question */
.q { padding: 20px 22px 20px 18px; display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 12px; align-items: start; min-width: 0; border-top: 1px solid var(--rule); }
.q:first-child { border-top: 0; }
.q:focus-within { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.qnum { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.qnum::before { content: "Q"; opacity: 0.6; }
.q.answered .qnum { color: var(--accent); }
.q fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q legend { padding: 0; font-weight: 600; font-size: 1.04rem; line-height: 1.4; }
.hint { color: var(--muted); font-size: 0.87rem; max-width: 72ch; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; display: inline-flex; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt span { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px 8px 11px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 0.9rem; font-weight: 500; cursor: pointer; background: var(--surface); line-height: 1.35; transition: background 0.12s ease, border-color 0.12s ease; }
.opt span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule); }
.opt input[type="checkbox"] + span::before { border-radius: 2px; }
.opt span:hover { border-color: var(--muted); }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.opt input:checked + span::before { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.linkbtn { appearance: none; border: 0; background: none; font: inherit; font-family: var(--font-mono); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 3px; align-self: flex-start; margin-left: -4px; }
.linkbtn:hover { text-decoration: underline; }
.qc-wrap { display: flex; flex-direction: column; gap: 6px; }
.qc-wrap label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
textarea { width: 100%; max-width: 72ch; resize: vertical; font: inherit; font-size: 0.92rem; line-height: 1.5; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 12px; }
textarea:focus-visible { border-color: var(--accent); }
.notes-body { padding: 20px 22px; gap: 10px; }
.notes-body label { font-weight: 600; font-size: 1.04rem; }
.notes-body textarea { min-height: 220px; max-width: none; }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); }

/* Reference cards */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 14px; align-items: stretch; }
@media (max-width: 900px) { .cards { grid-auto-columns: minmax(78%, 1fr); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; } .card { scroll-snap-align: start; } }
.card { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--rule); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.is-top { border-top-color: var(--dc); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h3 { font-family: var(--font-display); font-stretch: var(--display-stretch); font-size: 1.15rem; font-weight: var(--display-weight); }
.card .what { color: var(--muted); font-size: 0.89rem; }
.card h4 { font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.card h4.pro { color: var(--good); }
.card h4.con { color: var(--bad); }
.card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; }
.card li { position: relative; padding-left: 1.25em; }
.card li::before { position: absolute; left: 0; font-family: var(--font-mono); font-weight: 600; }
.card .pros li::before { content: "+"; color: var(--good); }
.card .cons li::before { content: "\2212"; color: var(--bad); }
.badge { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 3px; background: var(--dc); color: var(--dc-ink); }
.card .fit { margin-top: auto; border-top: 1px solid var(--rule); padding-top: 10px; font-size: 0.86rem; color: var(--muted); }
.card .fit b { color: var(--ink); font-weight: 600; }

/* Fit matrix */
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; font-size: 0.88rem; }
th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
td + td, th + td, th + th { border-left: 1px solid var(--rule); }
thead th { font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dc, var(--muted)); background: var(--surface-2); }
tbody tr:last-child > * { border-bottom: 0; }
tbody th { font-family: var(--font-display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); width: 18%; }
td.s { background: color-mix(in srgb, var(--good-soft) 55%, var(--surface)); }
td.a { background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); }
td.w { background: color-mix(in srgb, var(--bad-soft) 55%, var(--surface)); }
td.hl { box-shadow: inset 0 0 0 2px var(--ink); }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 3px; margin-bottom: 4px; font-weight: 500; }
.chip.s { background: var(--good-soft); color: var(--good); }
.chip.a { background: var(--warn-soft); color: var(--warn); }
.chip.w { background: var(--bad-soft); color: var(--bad); }
.footnote { color: var(--muted); font-size: 0.84rem; max-width: 80ch; }

/* Result */
.verdict { background: var(--panel-bg); color: var(--panel-fg); border: 1px solid var(--panel-rule); border-radius: var(--r); padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 22px; }
.sugg { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 22px 36px; align-items: start; }
@media (max-width: 760px) { .sugg { grid-template-columns: minmax(0, 1fr); } }
.sugg > .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sugg > .full { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; }
.pick { display: flex; flex-direction: column; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--panel-rule); }
.pick .label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--pc); display: flex; align-items: center; gap: 8px; }
.pick .label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.pick .name { font-family: var(--font-display); font-stretch: var(--display-stretch); font-size: clamp(1.6rem, 3vw, 2.3rem); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.05; }
.pick .conf { font-size: 0.84rem; color: var(--panel-muted); }
.meter { display: flex; gap: 3px; margin-top: 8px; max-width: 180px; }
.meter i { flex: 1; height: 5px; background: var(--panel-track); }
.meter i.on { background: var(--pc); }
.ranks { display: flex; flex-direction: column; gap: 10px; }
.rank { display: grid; grid-template-columns: minmax(0, 10rem) minmax(0, 1fr) 2.8rem; gap: 12px; align-items: center; font-size: 0.86rem; color: var(--panel-muted); }
.rank .bar-t { height: 6px; background: var(--panel-track); overflow: hidden; }
.rank .bar-t span { display: block; height: 100%; background: var(--pc); opacity: 0.55; transition: width 0.25s ease; }
.rank.top { font-weight: 600; color: var(--panel-fg); }
.rank.top .bar-t span { opacity: 1; }
.rank .pts { font-family: var(--font-mono); font-size: 0.76rem; text-align: right; font-variant-numeric: tabular-nums; }
.subhead { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--panel-muted); font-weight: 500; }
.reasons { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; max-width: 90ch; }
.flags { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.flag { font-size: 0.86rem; padding: 10px 12px; border: 1px solid var(--panel-rule); border-radius: var(--r); background: var(--panel-tint); }
.flag strong { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--panel-bad); margin-bottom: 2px; }
.empty { color: var(--panel-muted); font-size: 0.9rem; }
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border-top: 1px solid var(--panel-rule); padding-top: 14px; }

.fnotes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 32; background: var(--surface); border-top: 1px solid var(--rule); padding: 14px 32px; max-height: 34vh; overflow: auto; transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1); }

    var rows = [["Section", "Item", "Value", "Comment"], ["Export", "Date", fmtDate(s.at)], ["Export", "Answered", s.n + " of " + s.total]];
    if (s.rec) {
      s.rec.decisions.forEach(function (d) { rows.push(["Recommendation", d.decision, d.pick + " (" + d.confidence + ")"]); d.scores.forEach(function (x) { rows.push([d.decision + " score", x.option, x.score]); }); });
      s.rec.why.forEach(function (t) { rows.push(["Why", "", t]); });
      s.rec.watchOut.forEach(function (x) { rows.push(["Watch out", x.title, x.detail]); });
    }
    s.areas.forEach(function (a) { a.questions.forEach(function (q) { rows.push([a.area, q.question, q.answers.length ? q.answers.join("; ") : "Not answered", q.comment]); }); });
    if (DETAILS) rows.push(["Additional details", "Notes", s.notes || "None added"]);
    return "﻿" + rows.map(function (r) { while (r.length < 4) r.push(""); return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  }
  function toJson(s) { return JSON.stringify({ deck: DECK.title, exportedAt: s.at.toISOString(), answered: s.n, totalQuestions: s.total, recommendation: s.rec, areas: s.areas, notes: s.notes }, null, 2) + "\n"; }
  function browserSave(name, data, fmt) {
    var type = fmt === "csv" ? "text/csv" : fmt === "json" ? "application/json" : "text/markdown";
    var url = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
    var a = el("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  exportBox.addEventListener("click", async function (e) {
    var b = e.target.closest && e.target.closest("[data-export]");
    if (!b || exporting) return;
    var fmt = b.dataset.export, s = snapshot();
    var data = fmt === "md" ? toMarkdown(s) : fmt === "csv" ? toCsv(s) : toJson(s);
    var name = DECK.id + "-" + isoDay(s.at) + "." + fmt;
    if (!downloads) { browserSave(name, data, fmt); exportNote.textContent = "Exported " + FMT[fmt] + "."; return; }
    exporting = true; exportNote.textContent = "Confirm the save to finish.";
    try { await downloads.save({ filename: name, data: data }); exportNote.textContent = "Exported " + FMT[fmt] + "."; }
    catch (err) {
      var code = err && err.code;
      exportNote.textContent = code === "declined" ? "Export canceled." : code === "rate_limited" ? "Another save prompt is open. Try again in a moment." : "Export failed. Try another format.";
    } finally { exporting = false; }
  });
  (async function () {
    if (window.claude && typeof window.claude.use === "function") {
      try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
      exportBox.hidden = !downloads;
    } else exportBox.hidden = false;
  })();

  syncNotesCount();
  update();
  fromHash();
  start();
})();
</script>
</body>
