<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPORT_TITLE__</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfbfc;
  --surface: #ffffff;
  --surface-2: #f3f3f5;
  --surface-3: #e9e9ec;
  --ink: #121216;
  --ink-2: #4a4a53;
  --ink-3: #6b6b75;
  --line: #e4e4e8;
  --line-2: #cfcfd5;
  --accent: #2b49d8;
  --accent-hover: #1f3ab8;
  --accent-soft: #e9edfc;
  --on-accent: #ffffff;
  --critical: #b82a24; --critical-fill: #de4a42; --critical-soft: #fbeae9;
  --serious: #b04a00; --serious-fill: #ec7a2a; --serious-soft: #fdeee2;
  --moderate: #8a5d00; --moderate-fill: #e9ae1f; --moderate-soft: #fbf1d6;
  --minor: #3e55b8; --minor-fill: #7b93f0; --minor-soft: #e9edfc;
  --pass: #1b6e40; --pass-fill: #3dae6c; --pass-soft: #e3f3e9;
  --neutral: #6b6b75; --neutral-fill: #b8b8c0; --neutral-soft: #ededf0;
  --code-bg: #f6f6f8;
  --shadow: 0 1px 2px rgba(18, 18, 22, .05), 0 12px 32px -12px rgba(18, 18, 22, .18);
  --shadow-lg: 0 2px 6px rgba(18, 18, 22, .08), 0 32px 80px -24px rgba(18, 18, 22, .45);
  --r: 8px;
  --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f12; --surface: #15161b; --surface-2: #1b1d23; --surface-3: #24262e;
    --ink: #ebebee; --ink-2: #b4b5bd; --ink-3: #8e8f99; --line: #24262e; --line-2: #353842;
    --accent: #93a6ff; --accent-hover: #b0bdff; --accent-soft: #1d2340; --on-accent: #0e0f12;
    --critical: #ff8a82; --critical-fill: #e5544c; --critical-soft: #341a19;
    --serious: #ffa468; --serious-fill: #ec7a2a; --serious-soft: #35231a;
    --moderate: #f2c55a; --moderate-fill: #d9a21c; --moderate-soft: #302814;
    --minor: #a9b9ff; --minor-fill: #6f88ea; --minor-soft: #1d2340;
    --pass: #6fd39a; --pass-fill: #3aa868; --pass-soft: #14291d;
    --neutral: #8e8f99; --neutral-fill: #4b4e59; --neutral-soft: #1f2127;
    --code-bg: #111216;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .5), 0 32px 80px -24px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f12; --surface: #15161b; --surface-2: #1b1d23; --surface-3: #24262e;
  --ink: #ebebee; --ink-2: #b4b5bd; --ink-3: #8e8f99; --line: #24262e; --line-2: #353842;
  --accent: #93a6ff; --accent-hover: #b0bdff; --accent-soft: #1d2340; --on-accent: #0e0f12;
  --critical: #ff8a82; --critical-fill: #e5544c; --critical-soft: #341a19;
  --serious: #ffa468; --serious-fill: #ec7a2a; --serious-soft: #35231a;
  --moderate: #f2c55a; --moderate-fill: #d9a21c; --moderate-soft: #302814;
  --minor: #a9b9ff; --minor-fill: #6f88ea; --minor-soft: #1d2340;
  --pass: #6fd39a; --pass-fill: #3aa868; --pass-soft: #14291d;
  --neutral: #8e8f99; --neutral-fill: #4b4e59; --neutral-soft: #1f2127;
  --code-bg: #111216;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .5), 0 32px 80px -24px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; scrollbar-color: var(--line-2) transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--font); font-variant-numeric: tabular-nums; caret-color: var(--accent); }
::selection { background: var(--accent); color: var(--on-accent); }
a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: .2em; text-decoration-thickness: 1px; transition: text-decoration-color .15s; }
a:hover { color: var(--accent-hover); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--mono); font-size: .86em; font-feature-settings: normal; }
:not(pre) > code { background: var(--code-bg); border: 1px solid var(--line); padding: .08em .4em; border-radius: 5px; overflow-wrap: anywhere; color: var(--ink-2); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.012em; }
h1 { font-size: 2.125rem; font-weight: 600; letter-spacing: -.03em; }
h2 { font-size: 1.375rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
h4, h5, h6 { font-size: .9375rem; font-weight: 600; }
p { margin: 0 0 .8em; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 16px; top: -100px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; z-index: 100; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 32px; }
.muted { color: var(--ink-3); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.prose { max-width: 70ch; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { padding-left: 1.2em; margin: 0 0 .8em; }
.prose li + li { margin-top: .3em; }
.prose h4, .prose h5, .prose h6 { margin: 1em 0 .4em; }

/* ------------------------------------------------ masthead + tabs */
.masthead { display: flex; align-items: center; gap: 16px; min-height: 60px; padding-top: 10px; }
.masthead .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; }
.masthead .brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.masthead .brand .mark .icon { width: 16px; height: 16px; }
.masthead .brand strong { font-weight: 600; font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masthead .brand span { display: block; font-size: .8125rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masthead .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; font-size: .875rem; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--ink-3); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 28px; padding: 2px 10px; font-size: .8125rem; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--bg); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-panel { position: absolute; right: 0; top: calc(100% + 6px); min-width: 264px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 30; }
.menu-panel button { display: flex; width: 100%; flex-direction: column; gap: 1px; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 500; font-size: .875rem; }
.menu-panel button:hover { background: var(--surface-2); }
.menu-panel small { color: var(--ink-3); font-size: .78rem; font-weight: 400; }

.tabs-bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); border-bottom: 1px solid var(--line); margin-top: 14px; }
.tabs { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; display: flex; align-items: center; gap: 8px; padding: 12px 10px 13px; color: var(--ink-3); text-decoration: none; font-weight: 500; font-size: .9375rem; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tabs a:hover { color: var(--ink); }
.tabs a:first-child { margin-left: -10px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px 2px 0 0; }
.tabs .count { font-size: .8125rem; color: var(--ink-3); font-weight: 500; }
.tabs a[aria-current="page"] .count { color: var(--ink-2); }

main { padding: 40px 0 96px; }
main:focus { outline: none; }
.view-head { margin-bottom: 32px; }
.view-head h1:focus { outline: none; }
.view-head .lede { color: var(--ink-2); margin: 10px 0 0; max-width: 68ch; font-size: 1.0625rem; overflow-wrap: anywhere; }
.view-head .meta { color: var(--ink-3); font-size: .875rem; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; overflow-wrap: anywhere; }
.sep { color: var(--line-2); margin: 0 8px; }
.view-head .meta .sep { margin: 0; }
.view-head .crumb { font-size: .875rem; margin: 0 0 10px; }
section + section { margin-top: 56px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { color: var(--ink-3); margin: 0; font-size: .875rem; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* ------------------------------------------------ marks */
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--neutral-fill); flex: none; vertical-align: middle; }
.dot.critical { background: var(--critical-fill); } .dot.serious { background: var(--serious-fill); }
.dot.moderate { background: var(--moderate-fill); } .dot.minor { background: var(--minor-fill); }
.dot.pass { background: var(--pass-fill); }
.sev { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; white-space: nowrap; }
.sev.critical { color: var(--critical); } .sev.serious { color: var(--serious); } .sev.moderate { color: var(--moderate); } .sev.minor { color: var(--minor); } .sev.pass { color: var(--pass); }
.tag { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-2); font-size: .75rem; font-weight: 500; white-space: nowrap; text-decoration: none; background: var(--surface); }
a.tag:hover { border-color: var(--ink-3); color: var(--ink); }
.tag .icon { width: 12px; height: 12px; }
.tag.soft { border-color: transparent; background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral); }
.pill .icon { width: 13px; height: 13px; stroke-width: 2.2; }
.pill.critical { background: var(--critical-soft); color: var(--critical); }
.pill.serious { background: var(--serious-soft); color: var(--serious); }
.pill.moderate { background: var(--moderate-soft); color: var(--moderate); }
.pill.minor { background: var(--minor-soft); color: var(--minor); }
.pill.pass { background: var(--pass-soft); color: var(--pass); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: var(--ink-3); font-size: .8125rem; }
.meta-line code { font-size: .78rem; }

/* ------------------------------------------------ overview */
.verdict { margin: 0 0 40px; padding: 28px 0 32px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.verdict-line { font-size: 1.5rem; line-height: 1.35; letter-spacing: -.015em; max-width: 34em; margin: 0 0 26px; color: var(--ink-2); text-wrap: pretty; }
.verdict-line strong { color: var(--ink); font-weight: 600; }
.verdict-line b { color: var(--ink); font-weight: 600; }
.sevbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.sevbar span { display: block; height: 100%; transform-origin: left center; animation: grow .9s var(--ease) both; }
.sevbar span:nth-child(2) { animation-delay: .08s; } .sevbar span:nth-child(3) { animation-delay: .16s; } .sevbar span:nth-child(4) { animation-delay: .24s; }
@keyframes grow { from { transform: scaleX(0); } }
.sevbar .critical { background: var(--critical-fill); } .sevbar .serious { background: var(--serious-fill); }
.sevbar .moderate { background: var(--moderate-fill); } .sevbar .minor { background: var(--minor-fill); }
.sevkey { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 14px 0 0; padding: 0; list-style: none; }
.sevkey li { display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 2px 10px; align-items: center; font-size: .875rem; color: var(--ink-3); }
.sevkey .dot { margin-top: 1px; }
.sevkey strong { color: var(--ink); font-weight: 600; font-size: 1.0625rem; }
.sevkey .sub { grid-column: 2; }
.narrative { font-size: 1.0625rem; max-width: 70ch; margin: 0 0 8px; color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 20px 0 0; padding: 0; list-style: none; font-size: .9375rem; color: var(--ink-2); }
.facts li strong { color: var(--ink); font-weight: 600; }

.plan { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.plan li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 20px; padding: 20px 0 22px; border-bottom: 1px solid var(--line); align-items: start; }
.plan .n { font-size: 1.375rem; font-weight: 600; letter-spacing: -.02em; color: var(--ink-3); line-height: 1.2; grid-row: span 3; padding-top: 1px; }
.plan h3 { font-size: 1.0625rem; }
.plan h3 a { color: var(--ink); text-decoration: none; }
.plan h3 a:hover { color: var(--accent); text-decoration: underline; }
.plan .why { grid-column: 2; color: var(--ink-2); margin: 6px 0 0; max-width: 70ch; }
.plan .why p:last-child { margin: 0; }
.plan .meta-line { grid-column: 2; margin-top: 10px; }
.plan .after { grid-column: 3; grid-row: 1 / span 3; text-align: right; font-size: .8125rem; color: var(--ink-3); white-space: nowrap; line-height: 1.3; padding-top: 2px; }
.plan .after strong { display: block; font-size: 1.375rem; color: var(--ink); font-weight: 600; letter-spacing: -.02em; }
.plan .after strong small { font-size: .9375rem; color: var(--ink-3); font-weight: 500; }

.coverage { display: grid; gap: 28px; }
.principle-row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px 24px; align-items: start; }
.principle-row h3 { font-size: .9375rem; font-weight: 600; padding-top: 6px; }
.principle-row h3 span { display: block; color: var(--ink-3); font-weight: 400; font-size: .8125rem; margin-top: 2px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.cell { display: flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 6px; border-radius: 6px; font-family: var(--mono); font-size: .78rem; font-weight: 500; text-decoration: none; border: 1px solid transparent; transition: transform .15s var(--ease), box-shadow .15s; }
.cell:hover { transform: translateY(-1px); box-shadow: var(--shadow); text-decoration: none; }
.cell.fail { background: var(--critical); color: var(--bg); }
.cell.review { background: var(--moderate-fill); color: #1a1400; }
.cell.pass { background: var(--pass-soft); color: var(--pass); }
.cell.manual { background: var(--surface-2); color: var(--ink-2); }
.cell.na { background: transparent; color: var(--ink-3); border-color: var(--line); border-style: dashed; }
.keyline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8125rem; color: var(--ink-2); margin: 0 0 20px; padding: 0; list-style: none; }
.keyline li { display: flex; gap: 8px; align-items: center; }
.keyline .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid transparent; }
.keyline .sw.fail { background: var(--critical); } .keyline .sw.review { background: var(--moderate-fill); } .keyline .sw.pass { background: var(--pass-soft); border-color: var(--pass-fill); }
.keyline .sw.manual { background: var(--surface-3); } .keyline .sw.na { border-color: var(--line-2); border-style: dashed; }
.failing-list { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line); }
.failing-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .9375rem; }
.failing-list code { font-size: .8125rem; background: none; border: 0; padding: 0; color: var(--ink-3); }
.failing-list .state { font-size: .8125rem; }
.note { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); color: var(--ink-2); font-size: .9rem; }
.note .icon { margin-top: 3px; color: var(--ink-3); }
.note p { margin: 0; }

/* ------------------------------------------------ toolbar / filters */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center; padding: 0 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.search { position: relative; flex: 1 1 260px; min-width: 200px; }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; min-height: 36px; padding: 6px 12px 6px 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.select { position: relative; display: inline-flex; align-items: center; }
.select select { appearance: none; -webkit-appearance: none; min-height: 36px; padding: 6px 30px 6px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: .875rem; font-weight: 500; max-width: 240px; text-overflow: ellipsis; cursor: pointer; }
.select select:hover { border-color: var(--ink-3); }
.select select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.select .icon { position: absolute; right: 10px; pointer-events: none; color: var(--ink-3); width: 14px; height: 14px; }
.seg-filter { display: inline-flex; gap: 4px; }
.seg-filter .btn { gap: 7px; }
.results-line { color: var(--ink-3); font-size: .875rem; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.empty { text-align: center; padding: 56px 24px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 10px; }
.empty .icon { width: 28px; height: 28px; color: var(--pass); margin-bottom: 10px; }
.empty h2 { margin-bottom: 6px; font-size: 1.125rem; }
.empty p { margin: 0; }

/* ------------------------------------------------ issues */
.issue-list { border-top: 1px solid var(--line); }
.issue { border-bottom: 1px solid var(--line); scroll-margin-top: 72px; }
.issue > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 20px; gap: 4px 14px; align-items: start; padding: 18px 0 18px; position: relative; }
.issue > summary::-webkit-details-marker { display: none; }
.issue > summary::before { content: ""; position: absolute; inset: 0 -12px; border-radius: 10px; background: var(--surface-2); opacity: 0; transition: opacity .15s; z-index: -1; }
.issue > summary:hover::before { opacity: 1; }
.issue > summary .dot { margin-top: 8px; margin-left: 4px; }
.issue > summary .chev { color: var(--ink-3); margin-top: 5px; transition: transform .25s var(--ease); }
.issue[open] > summary .chev { transform: rotate(90deg); }
.issue .s-title { font-weight: 600; font-size: 1.0625rem; line-height: 1.4; letter-spacing: -.01em; }
.issue .s-meta { grid-column: 2; margin-top: 4px; }
.issue .s-count { text-align: right; white-space: nowrap; color: var(--ink-3); font-size: .8125rem; line-height: 1.3; padding-top: 2px; }
.issue .s-count strong { display: block; color: var(--ink); font-size: 1.25rem; font-weight: 600; letter-spacing: -.02em; }
.issue-body { padding: 4px 0 36px 34px; }
.issue[open] .issue-body { animation: reveal .35s var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.issue-body h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.issue-body .block + .block { margin-top: 26px; }
.tailored { font-size: .72rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; letter-spacing: .01em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }

.tablist { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 24px; overflow-x: auto; scrollbar-width: none; }
.tablist::-webkit-scrollbar { display: none; }
.tablist button { position: relative; appearance: none; border: 0; background: none; padding: 9px 12px 11px; color: var(--ink-3); font-weight: 500; font-size: .9375rem; cursor: pointer; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tablist button:hover { color: var(--ink); background: var(--surface-2); }
.tablist button[aria-selected="true"] { color: var(--ink); }
.tablist button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px 2px 0 0; }
.tablist button .count { color: var(--ink-3); font-size: .8125rem; margin-left: 6px; }
.tabpanel[hidden] { display: none; }
.fix-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.code-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin: 12px 0; }
.code-pair .code { margin: 0; }
.code { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.code figcaption { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; font-size: .75rem; font-weight: 600; color: var(--ink-3); border-bottom: 1px solid var(--line); }
.code figcaption .lang { font-weight: 400; color: var(--ink-3); font-family: var(--mono); }
.code figcaption .copy { margin-left: auto; }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: .8125rem; line-height: 1.6; tab-size: 2; }
.code-before figcaption > span:first-child { color: var(--critical); }
.code-after figcaption > span:first-child { color: var(--pass); }
.code-before figcaption > span:first-child::before, .code-after figcaption > span:first-child::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
.copy { border: 0; background: transparent; color: var(--ink-2); font-size: .75rem; font-weight: 600; padding: 3px 8px; border-radius: 5px; cursor: pointer; min-height: 24px; }
.copy:hover { background: var(--surface-3); color: var(--ink); }

.contrast-demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 14px 0 6px; }
.swatch { border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.swatch .sample { padding: 16px; font-size: 1rem; line-height: 1.35; }
.swatch .sample small { display: block; font-size: .78rem; font-family: var(--mono); margin-top: 4px; }
.swatch .facts-row { padding: 8px 12px; font-size: .8125rem; color: var(--ink-2); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--surface); }
.swatch .facts-row strong { color: var(--ink); font-weight: 600; }

.instances { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px 28px; }
.instance { min-width: 0; }
.instance-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; font-size: .875rem; }
.instance-head a:first-child { font-weight: 600; color: var(--ink); }
.shot-btn { display: block; width: 100%; min-height: 48px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: zoom-in; overflow: hidden; margin-bottom: 10px; transition: border-color .15s; }
.shot-btn:hover { border-color: var(--ink-3); }
.shot-btn img { display: block; max-height: 260px; width: auto; margin: 0 auto; }
.selector { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.selector code { flex: 1; min-width: 0; font-size: .78rem; }
.snippet { margin: 0 0 8px; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; font-size: .78rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow: auto; }
.why { font-size: .8125rem; color: var(--ink-3); }
.why > summary { cursor: pointer; min-height: 24px; display: inline-flex; align-items: center; font-weight: 500; }
.why ul { margin: 6px 0 0; padding-left: 1.1em; color: var(--ink-2); }
.why li + li { margin-top: 2px; }
.more-row { display: flex; justify-content: center; margin-top: 20px; }
.sub-details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.sub-details > summary { cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: .9rem; padding: 4px 0; }
.sub-details[open] > summary { margin-bottom: 8px; }

/* ------------------------------------------------ pages */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; color: var(--ink-3); font-weight: 600; letter-spacing: .01em; }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
thead th { border-bottom-color: var(--ink); }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
td.num, th.num { text-align: right; }
.page-cell a { font-weight: 600; color: var(--ink); text-decoration: none; }
.page-cell a:hover { color: var(--accent); text-decoration: underline; }
.page-cell .url { display: block; font-size: .8125rem; color: var(--ink-3); overflow-wrap: anywhere; font-family: var(--mono); }
.page-detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.page-shots { display: grid; gap: 16px; }
.page-shots figure { margin: 0; }
.page-shots figcaption { font-size: .8125rem; color: var(--ink-3); margin-top: 6px; }
.page-shots .shot-btn img { max-height: 440px; }
.compact-issues { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.compact-issues li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.compact-issues a { color: var(--ink); text-decoration: none; font-weight: 500; }
.compact-issues a:hover { color: var(--accent); text-decoration: underline; }
.compact-issues .n { margin-left: auto; color: var(--ink-3); font-size: .8125rem; white-space: nowrap; }
.compact-issues .sev { font-size: .8125rem; min-width: 84px; }

/* ------------------------------------------------ review + checklist */
.verdict-ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border: 0; padding: 0; margin: 0; }
.verdict-ctl legend { font-size: .875rem; font-weight: 600; color: var(--ink-2); float: left; padding: 0; margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg label { position: relative; padding: 5px 12px; font-size: .875rem; cursor: pointer; color: var(--ink-2); min-height: 32px; display: inline-flex; align-items: center; }
.seg label + label { border-left: 1px solid var(--line-2); }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:hover { background: var(--surface-2); }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.review-box { padding: 16px 18px; border-radius: 10px; background: var(--surface-2); margin: 0 0 24px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.review-box .hint { font-size: .875rem; color: var(--ink-2); margin: 0; }
.progress { display: flex; align-items: center; gap: 12px; font-size: .875rem; color: var(--ink-2); white-space: nowrap; }
.progress .track { width: 160px; height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--ink); border-radius: inherit; transition: width .3s var(--ease); }
.principle-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 48px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.principle-head h2 { font-size: 1.125rem; }
.principle-head p { margin: 0; font-size: .875rem; color: var(--ink-3); }
.sc-list { list-style: none; margin: 0; padding: 0; }
.sc { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 0 18px; border-bottom: 1px solid var(--line); scroll-margin-top: 80px; align-items: start; }
.sc:target, .sc:focus { background: var(--accent-soft); box-shadow: 0 0 0 12px var(--accent-soft); border-radius: 2px; outline: none; }
.sc .scn { font-family: var(--mono); font-size: .8125rem; color: var(--ink-3); padding-top: 3px; }
.sc h3 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 1rem; }
.sc h3 a { color: inherit; text-decoration: none; }
.sc h3 a:hover { text-decoration: underline; color: var(--accent); }
.sc .how { grid-column: 2; color: var(--ink-2); font-size: .9rem; margin: 0; max-width: 72ch; }
.sc .auto { grid-column: 2; font-size: .8125rem; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--ink-3); margin-top: 2px; }
.sc .ctl { grid-column: 3; grid-row: 1 / span 3; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sc textarea { grid-column: 2 / -1; width: 100%; min-height: 40px; resize: vertical; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-size: .875rem; margin-top: 6px; }
.sc textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.sc textarea[hidden] { display: none; }
.sc .state.fail { color: var(--critical); font-weight: 600; } .sc .state.review { color: var(--moderate); font-weight: 600; } .sc .state.pass { color: var(--pass); font-weight: 600; }

/* ------------------------------------------------ dialog + toast */
dialog.viewer { border: 0; padding: 0; border-radius: 12px; background: var(--surface); color: var(--ink); max-width: min(1200px, 94vw); max-height: 92vh; box-shadow: var(--shadow-lg); }
dialog.viewer::backdrop { background: rgba(8, 8, 12, .62); backdrop-filter: blur(4px); }
dialog.viewer .viewer-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
dialog.viewer .viewer-head p { margin: 0; font-size: .875rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
dialog.viewer .viewer-body { overflow: auto; max-height: calc(92vh - 56px); background: var(--surface-2); }
dialog.viewer img { display: block; margin: 0 auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .875rem; font-weight: 500; pointer-events: none; transition: opacity .2s, transform .3s var(--ease); z-index: 60; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------------------------ responsive */
@media (max-width: 960px) {
  .page-detail { grid-template-columns: minmax(0, 1fr); }
  .principle-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .principle-row h3 { padding-top: 0; }
  .sevkey { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  main { padding: 28px 0 72px; }
  h1 { font-size: 1.625rem; }
  .verdict-line { font-size: 1.25rem; }
  .masthead .brand #brand-sub { display: none; }
  .masthead .btn .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .plan li { grid-template-columns: 32px minmax(0, 1fr); }
  .plan .n { font-size: 1.125rem; grid-row: span 4; }
  .plan .after { grid-column: 2; grid-row: auto; text-align: left; margin-top: 8px; }
  .plan .after strong { display: inline; font-size: 1rem; margin-right: 6px; }
  .issue > summary { grid-template-columns: 20px minmax(0, 1fr) 20px; }
  .issue .s-count { grid-column: 2; text-align: left; padding-top: 0; }
  .issue .s-count strong { display: inline; font-size: .9375rem; margin-right: 4px; }
  .issue > summary .chev { grid-column: 3; grid-row: 1; }
  .issue-body { padding-left: 0; }
  .sc { grid-template-columns: 56px minmax(0, 1fr); }
  .sc .ctl { grid-column: 2; grid-row: auto; align-items: flex-start; flex-direction: row; flex-wrap: wrap; margin-top: 6px; }
  .sc textarea { grid-column: 1 / -1; }
  .cells { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); }
  .instances { grid-template-columns: minmax(0, 1fr); }
  .progress .track { width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
@media print {
  .masthead .spacer ~ *, .tabs-bar, .toolbar, .actions, .copy, .tablist { display: none !important; }
  .tabpanel[hidden] { display: block; }
  .issue-body { padding-left: 0; }
}
</style>
