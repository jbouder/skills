<script>
(() => {
'use strict';
const R = JSON.parse(document.getElementById('report-data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const icon = (name, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
const IMPACTS = ['critical', 'serious', 'moderate', 'minor'];
const IMPACT_LABEL = { critical: 'Critical', serious: 'Serious', moderate: 'Moderate', minor: 'Minor' };
const pageById = Object.fromEntries(R.pages.map((p) => [p.id, p]));
const issueById = Object.fromEntries(R.issues.map((i) => [i.id, i]));
const violations = R.issues.filter((i) => i.kind === 'violation');
const reviews = R.issues.filter((i) => i.kind === 'review');
const storeKey = `a11y-audit:${R.meta.origin}:${R.meta.startedAt}`;
const fmtDate = (d, opts = { dateStyle: 'medium' }) => new Date(d).toLocaleString(undefined, opts);

// ------------------------------------------------ storage (per viewer, best effort)
const store = {
  get(k, d) { try { const v = localStorage.getItem(`${storeKey}:${k}`); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`${storeKey}:${k}`, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const verdicts = store.get('verdicts', {});
const checklist = store.get('checklist', {});

// ------------------------------------------------ theme
const themeBtn = $('#theme-toggle');
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  themeBtn.innerHTML = icon(dark ? 'sun' : 'moon');
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
let theme = null; try { theme = localStorage.getItem('a11y-audit:theme'); } catch { /* ignore */ }
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('a11y-audit:theme', theme); } catch { /* ignore */ }
  applyTheme(theme);
});

// ------------------------------------------------ helpers
const live = $('#live');
const announce = (msg) => { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 30); };
const toastEl = $('#toast'); let toastT;
const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800); announce(msg); };
async function copyText(text, what = 'Copied') {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch { /* ignore */ } ta.remove(); }
  toast(`${what} to clipboard`);
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const sev = (impact) => `<span class="sev ${impact}"><span class="dot ${impact}" aria-hidden="true"></span>${IMPACT_LABEL[impact] || impact}</span>`;
const levelLabel = (i) => i.level === 'best-practice' ? 'Best practice' : i.level === 'other' ? '' : `Level ${i.level}`;
const scTags = (i) => i.wcag.map((sc) => `<a class="tag" href="#/checklist/${sc}" title="${esc(`WCAG ${sc} ${criterionBySc[sc]?.name || ''}`.trim())}">${sc}</a>`).join('');
const titleCount = {}; R.pages.forEach((p) => { if (p.title) titleCount[p.title] = (titleCount[p.title] || 0) + 1; });
// Use the title when it identifies the page; apps that reuse one title get the path.
const pageLabel = (p) => { if (!p) return ''; const u = new URL(p.url); const path = (u.pathname + u.search + u.hash) || '/'; return p.title && titleCount[p.title] === 1 ? p.title : path; };
const pathOf = (url) => { try { const u = new URL(url); return u.pathname + u.search + u.hash; } catch { return url; } };
const hostOf = (url) => { try { return new URL(url).host; } catch { return url; } };
const criterionBySc = Object.fromEntries(R.criteria.map((c) => [c.sc, c]));
const sep = '<span class="sep" aria-hidden="true">·</span>';

// ------------------------------------------------ routing
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [p, q] = h.split('?');
  const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
  return { view: parts[0] || 'overview', arg: parts[1] || null, params: new URLSearchParams(q || '') };
}
function setParams(view, params, replace = true) {
  const q = params.toString();
  const url = `#/${view}${q ? `?${q}` : ''}`;
  if (replace) history.replaceState(null, '', url); else location.hash = url;
}
let lastView = null;
function route() {
  const { view, arg, params } = parseHash();
  const views = { overview: renderOverview, issues: renderIssues, issue: renderIssues, pages: renderPages, page: renderPage, review: renderReview, checklist: renderChecklist };
  const issueKind = view === 'issue' && issueById[arg] ? issueById[arg].kind : null;
  const fn = issueKind === 'review' ? renderReview : (views[view] || renderOverview);
  const navKey = issueKind === 'review' ? 'review' : ({ issue: 'issues', page: 'pages' }[view] || (views[view] ? view : 'overview'));
  $$('[data-nav]').forEach((a) => (a.dataset.nav === navKey ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  const main = $('#main');
  main.innerHTML = fn(arg, params);
  wire(main);
  const sameView = lastView === `${view}/${arg || ''}`;
  lastView = `${view}/${arg || ''}`;
  if (view === 'issue' && arg) {
    const el = document.getElementById(`issue-${arg}`) || document.getElementById(`issue-${arg.split('.')[0]}`);
    if (el) { el.open = true; renderIssueBody(el); el.scrollIntoView({ block: 'start' }); el.querySelector('summary').focus({ preventScroll: true }); return; }
  }
  if (view === 'checklist' && arg) {
    const el = document.getElementById(`sc-${arg}`);
    if (el) { el.scrollIntoView({ block: 'start' }); el.focus({ preventScroll: true }); return; }
  }
  if (!sameView) { window.scrollTo(0, 0); const h1 = main.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
  document.title = `${(main.querySelector('h1')?.textContent || '').trim()} · ${R.title}`;
}
window.addEventListener('hashchange', route);

// ------------------------------------------------ overview
function verdictLine(s) {
  const clean = s.pagesClean;
  if (!s.issues) {
    return `<strong>No automated failures.</strong> Every one of the ${plural(s.pagesScanned, 'page')} scanned passed the automated ${esc(R.meta.standardLabel)} rules.${s.review ? ` <b>${s.review}</b> ${s.review === 1 ? 'result still needs' : 'results still need'} a person to decide.` : ''}`;
  }
  const word = s.byImpact.critical ? 'Needs work.' : s.byImpact.serious ? 'Needs attention.' : 'Nearly there.';
  return `<strong>${word}</strong> <b>${s.issues}</b> distinct ${s.issues === 1 ? 'issue' : 'issues'} on <b>${s.instances}</b> ${s.instances === 1 ? 'element' : 'elements'} across <b>${s.pagesScanned - clean} of ${s.pagesScanned}</b> pages. ${clean ? `${clean === 1 ? 'One page passes' : `${clean} pages pass`} every automated check` : 'No page passes every automated check'}${s.review ? `, and <b>${s.review}</b> ${s.review === 1 ? 'result needs' : 'results need'} a person to decide.` : '.'}`;
}
function renderOverview() {
  const s = R.summary;
  const totalIssues = Math.max(1, s.issues);
  const bar = IMPACTS.filter((k) => s.byImpact[k]).map((k) => `<span class="${k}" style="width:${(s.byImpact[k] / totalIssues) * 100}%"></span>`).join('');
  const key = IMPACTS.map((k) => `<li><span class="dot ${k}" aria-hidden="true"></span><span><strong>${s.byImpact[k] || 0}</strong> ${IMPACT_LABEL[k].toLowerCase()}</span><span class="sub">${plural(s.instancesByImpact[k] || 0, 'element')}</span></li>`).join('');
  const plan = R.plan.map((step, n) => {
    const first = issueById[step.issues[0]];
    const href = `#/issue/${step.issues[0]}`;
    const hasViolation = step.issues.some((id) => issueById[id]?.kind === 'violation');
    return `<li>
      <span class="n" aria-hidden="true">${n + 1}</span>
      <h3><a href="${href}"><span class="sr-only">Step ${n + 1}: </span>${esc(step.title)}</a></h3>
      ${hasViolation ? `<div class="after"><strong>${step.cleanAfter}<small> / ${s.pagesScanned}</small></strong>pages clean after this</div>` : ''}
      ${step.whyHtml ? `<div class="why prose">${step.whyHtml}</div>` : ''}
      <div class="meta-line">${first ? sev(first.impact) : ''}${hasViolation ? '' : '<span class="tag soft">From needs review</span>'}<span>Clears ${plural(step.instances, 'element')} on ${plural(step.pages, 'page')}</span>${first?.enrichment?.effort ? `<span>Effort: ${esc(first.enrichment.effort)}</span>` : ''}${step.issues.length > 1 ? `<span>${step.issues.length} related issues</span>` : ''}</div>
    </li>`;
  }).join('');
  const principles = { 1: ['Perceivable', 'Can everyone see or hear it?'], 2: ['Operable', 'Can everyone use it?'], 3: ['Understandable', 'Does it make sense?'], 4: ['Robust', 'Does assistive tech get it?'] };
  const statusMeta = { fail: 'Failing', review: 'Needs review', pass: 'Passed automated checks', manual: 'Needs a person', na: 'Not applicable here' };
  const rows = Object.entries(principles).map(([n, [name, q]]) => {
    const list = R.criteria.filter((c) => c.sc.startsWith(`${n}.`));
    const failing = list.filter((c) => c.status === 'fail').length;
    return `<div class="principle-row"><h3>${n}. ${name}<span>${failing ? `${plural(failing, 'criterion', 'criteria')} failing` : esc(q)}</span></h3><ul class="cells">${list.map((c) => {
      const href = c.failing.length ? `#/issues?sc=${c.sc}` : c.review.length ? `#/review?sc=${c.sc}` : `#/checklist/${c.sc}`;
      return `<li><a class="cell ${c.status}" href="${href}" title="${esc(`${c.sc} ${c.name}: ${statusMeta[c.status]}`)}">${c.sc}<span class="sr-only"> ${esc(c.name)}, ${statusMeta[c.status]}</span></a></li>`;
    }).join('')}</ul></div>`;
  }).join('');
  const attention = R.criteria.filter((c) => c.status === 'fail' || c.status === 'review');
  const errors = R.pages.filter((p) => p.error);
  return `
  <div class="view-head">
    <h1 tabindex="-1">${esc(R.title)}</h1>
    <p class="meta"><span>${esc(R.meta.standardLabel)}${R.meta.bestPractices ? ' + best practices' : ''}</span>${sep}<span>${plural(s.pagesScanned, 'page')} ${R.meta.mode === 'crawl' ? 'crawled' : 'scanned'} from <a href="${esc(R.meta.startUrls[0])}" target="_blank" rel="noopener">${esc(hostOf(R.meta.origin))}</a></span>${sep}<span>${esc(fmtDate(R.meta.startedAt, { dateStyle: 'long', timeStyle: 'short' }))}</span>${R.meta.authenticated ? `${sep}<span>Signed in</span>` : ''}</p>
  </div>
  <section aria-labelledby="sum-h">
    <h2 id="sum-h" class="sr-only">Summary</h2>
    <div class="verdict">
      <p class="verdict-line">${verdictLine(s)}</p>
      ${s.issues ? `<div class="sevbar" role="img" aria-label="Issues by impact: ${IMPACTS.map((k) => `${s.byImpact[k] || 0} ${k}`).join(', ')}">${bar}</div><ul class="sevkey">${key}</ul>` : ''}
    </div>
    <div class="narrative prose">${R.narrativeHtml}</div>
  </section>
  ${!s.issues && R.plan.length ? `<p class="note">${icon('pass')}<span>No automated rule failed on any page. The work below comes from the ${plural(s.review, 'result')} that <a href="#/review">need your review</a>.</span></p>` : ''}
  ${!s.issues && !R.plan.length ? `<section><div class="empty">${icon('pass')}<h2>Nothing to fix from the automated scan</h2><p>${s.review ? `${plural(s.review, 'result')} still <a href="#/review">need your review</a>, and the manual checklist covers what automation can't.` : 'Finish the manual checklist to confirm conformance.'}</p></div></section>` : ''}
  ${R.plan.length ? `<section aria-labelledby="plan-h">
    <div class="section-head"><h2 id="plan-h">Fix these first</h2><p>Ordered by how many pages and people each fix helps</p></div>
    <ol class="plan">${plan}</ol>
  </section>` : ''}
  <section aria-labelledby="crit-h">
    <div class="section-head"><h2 id="crit-h">${esc(R.meta.standardLabel)} coverage</h2><p>${s.criteria.fail} failing${sep}${s.criteria.review} to review${sep}${s.criteria.pass} passed automated checks${sep}${s.criteria.manual} need a person</p></div>
    <ul class="keyline">${Object.entries(statusMeta).map(([k, label]) => `<li><span class="sw ${k}" aria-hidden="true"></span>${label}</li>`).join('')}</ul>
    <div class="coverage">${rows}</div>
    ${attention.length ? `<ul class="failing-list" aria-label="Criteria that need attention">${attention.map((c) => `<li><code>${c.sc}</code><a href="${c.failing.length ? `#/issues?sc=${c.sc}` : `#/review?sc=${c.sc}`}">${esc(c.name)}</a><span class="state sev ${c.status === 'fail' ? 'critical' : 'moderate'}">${c.status === 'fail' ? plural(c.failing.length, 'issue') : `${plural(c.review.length, 'item')} to review`}</span></li>`).join('')}</ul>` : ''}
    <p class="note" style="margin-top:24px">${icon('info')}<span>Automated checks only cover part of WCAG. A criterion marked "passed" means no automated rule failed, not that the page conforms. The <a href="#/checklist">manual checklist</a> explains how to test each criterion by hand.</span></p>
  </section>
  ${errors.length ? `<section aria-labelledby="err-h"><div class="section-head"><h2 id="err-h">Pages that could not be scanned</h2></div><ul class="compact-issues">${errors.map((p) => `<li><span style="overflow-wrap:anywhere">${esc(p.url)}</span><span class="n">${esc(p.error)}</span></li>`).join('')}</ul></section>` : ''}`;
}

// ------------------------------------------------ issues (shared by Issues and Needs review)
function filterIssues(list, params) {
  const q = (params.get('q') || '').toLowerCase().trim();
  const impacts = (params.get('impact') || '').split(',').filter(Boolean);
  const page = params.get('page'); const sc = params.get('sc'); const level = params.get('level'); const vp = params.get('vp');
  let out = list.filter((i) => {
    if (impacts.length && !impacts.includes(i.impact)) return false;
    if (page && !i.pages.includes(page)) return false;
    if (sc && !i.wcag.includes(sc)) return false;
    if (level && i.level !== level) return false;
    if (vp && !i.instances.some((x) => x.viewports.includes(vp))) return false;
    if (q) {
      const hay = `${i.title} ${i.help} ${i.ruleId} ${i.wcag.join(' ')} ${i.shape || ''} ${i.headline || ''} ${i.instances.slice(0, 50).map((x) => `${x.target} ${x.html}`).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = params.get('sort') || 'priority';
  const IW = { critical: 4, serious: 3, moderate: 2, minor: 1 };
  if (sort === 'pages') out = [...out].sort((a, b) => b.pageCount - a.pageCount || b.instanceCount - a.instanceCount);
  else if (sort === 'instances') out = [...out].sort((a, b) => b.instanceCount - a.instanceCount);
  else if (sort === 'leverage') out = [...out].sort((a, b) => b.leverage - a.leverage);
  else out = [...out].sort((a, b) => IW[b.impact] - IW[a.impact] || b.pageCount - a.pageCount || b.instanceCount - a.instanceCount);
  return out;
}

function filterBar(view, params, list) {
  const impacts = (params.get('impact') || '').split(',').filter(Boolean);
  const present = IMPACTS.filter((k) => list.some((i) => i.impact === k));
  const levels = [...new Set(list.map((i) => i.level))].filter((l) => l !== 'other');
  const pagesHit = R.pages.filter((p) => list.some((i) => i.pages.includes(p.id)));
  const scs = [...new Set(list.flatMap((i) => i.wcag))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const opt = (v, label, cur) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(label)}</option>`;
  const select = (id, name, label, options) => `<div class="select"><label class="sr-only" for="${id}">${label}</label><select id="${id}" name="${name}">${options}</select>${icon('chevron-down')}</div>`;
  return `<form class="toolbar" role="search" data-filters="${view}" onsubmit="return false">
    <div class="search"><label class="sr-only" for="f-q">Search issues</label>${icon('search')}<input id="f-q" name="q" type="search" value="${esc(params.get('q') || '')}" placeholder="Search issues…" autocomplete="off"></div>
    ${present.length > 1 ? `<div class="seg-filter" role="group" aria-label="Filter by impact">${present.map((k) => `<button type="button" class="btn small" data-impact="${k}" aria-pressed="${impacts.includes(k)}"><span class="dot ${k}" aria-hidden="true"></span>${IMPACT_LABEL[k]}</button>`).join('')}</div>` : ''}
    ${levels.length > 1 ? select('f-level', 'level', 'Level', `${opt('', 'All levels', params.get('level') || '')}${levels.map((l) => opt(l, l === 'best-practice' ? 'Best practice' : `Level ${l}`, params.get('level'))).join('')}`) : ''}
    ${scs.length > 1 ? select('f-sc', 'sc', 'WCAG criterion', `${opt('', 'All criteria', params.get('sc') || '')}${scs.map((sc) => opt(sc, `${sc} ${criterionBySc[sc]?.name || ''}`, params.get('sc'))).join('')}`) : ''}
    ${pagesHit.length > 1 ? select('f-page', 'page', 'Page', `${opt('', 'All pages', params.get('page') || '')}${pagesHit.map((p) => opt(p.id, pageLabel(p), params.get('page'))).join('')}`) : ''}
    ${R.meta.viewports.length > 1 ? select('f-vp', 'vp', 'Viewport', `${opt('', 'Any viewport', params.get('vp') || '')}${R.meta.viewports.map((v) => opt(v.name, `${v.name[0].toUpperCase()}${v.name.slice(1)} (${v.width}px)`, params.get('vp'))).join('')}`) : ''}
    ${select('f-sort', 'sort', 'Sort', `${opt('priority', 'Sort: impact', params.get('sort') || 'priority')}${opt('leverage', 'Sort: biggest payoff', params.get('sort'))}${opt('pages', 'Sort: most pages', params.get('sort'))}${opt('instances', 'Sort: most elements', params.get('sort'))}`)}
  </form>`;
}

function issueSummary(i) {
  const shape = i.shape ? `<span><code>${esc(i.shape)}</code>${i.context && i.context !== 'body' ? ` in <code>${esc(i.context)}</code>` : ''}</span>` : '';
  return `<summary>
    <span class="dot ${i.impact}" aria-hidden="true"></span>
    <h2 class="s-title">${esc(i.title)}</h2>
    <span class="s-count"><strong>${i.instanceCount}</strong>${i.instanceCount === 1 ? 'element' : 'elements'} on ${plural(i.pageCount, 'page')}</span>
    ${icon('chevron', 'icon chev')}
    <span class="s-meta meta-line"><span class="sev ${i.impact}">${IMPACT_LABEL[i.impact]}</span>${i.source === 'heuristic' ? '<span class="tag soft">Heuristic check</span>' : ''}${i.tags.includes('experimental') ? '<span class="tag soft">Experimental rule</span>' : ''}<span>${esc(levelLabel(i))}</span>${i.wcag.length ? `<span>WCAG ${i.wcag.join(', ')}</span>` : ''}<span><code>${esc(i.ruleId)}</code></span>${shape}${i.headline ? `<span>${esc(i.headline)}</span>` : ''}</span>
  </summary>`;
}

function issueList(list, view) {
  if (!list.length) return '';
  return `<div class="issue-list">${list.map((i) => `<details class="issue" id="issue-${i.id}" data-issue="${i.id}" data-view="${view}">${issueSummary(i)}<div class="issue-body" hidden></div></details>`).join('')}</div>`;
}

function contrastBlock(i) {
  const c = i.contrast; if (!c) return '';
  const sug = c.suggestion;
  return `<div class="contrast-demo">
    <div class="swatch"><div class="sample" style="color:${esc(c.fg)};background:${esc(c.bg)}">Current text<small>${esc(c.fg)} on ${esc(c.bg)}</small></div><div class="facts-row"><span><strong>${esc(c.ratio)}:1</strong> measured</span><span class="sev critical">Needs ${esc(c.needed)}:1</span></div></div>
    ${sug ? `<div class="swatch"><div class="sample" style="color:${esc(sug.hex)};background:${esc(c.bg)}">Suggested text<small>${esc(sug.hex)} on ${esc(c.bg)}</small></div><div class="facts-row"><span><strong>${sug.ratio}:1</strong> <span class="sev pass">passes</span></span><button type="button" class="copy" data-copy-text="${esc(sug.hex)}">Copy ${esc(sug.hex)}</button></div></div>` : ''}
  </div>
  <p class="muted small">Measured at ${esc(c.fontSize || '')}${c.fontWeight ? `, weight ${esc(c.fontWeight)}` : ''}. The suggestion keeps the same hue and only changes lightness; check it against your palette.</p>`;
}

function instanceHtml(x) {
  const p = pageById[x.page];
  const msgs = [...new Set(x.checks.map((c) => c.message))];
  return `<div class="instance">
    <div class="instance-head"><a href="#/page/${x.page}">${esc(pageLabel(p))}</a>${pageLabel(p) !== pathOf(p?.url) ? `<span class="muted"><code>${esc(pathOf(p?.url))}</code></span>` : ''}${x.viewports.map((v) => `<span class="tag soft">${esc(v)}</span>`).join('')}<a class="tag" href="${esc(p?.url)}" target="_blank" rel="noopener">Open page ${icon('external')}</a></div>
    ${x.screenshot ? `<button type="button" class="shot-btn" data-shot="${esc(x.screenshot)}" data-caption="${esc(`${pageLabel(p)}: ${x.target}`)}"><img src="${esc(x.screenshot)}" alt="Screenshot of the failing element, outlined in pink" loading="lazy"><span class="sr-only">Enlarge screenshot</span></button>` : ''}
    <div class="selector"><code>${esc(x.target)}</code><button type="button" class="copy" data-copy-text="${esc(x.target)}" aria-label="Copy selector">Copy</button></div>
    <pre class="snippet" tabindex="0" aria-label="Element HTML"><code>${esc(x.html)}</code></pre>
    ${msgs.length ? `<details class="why"><summary>Why it was flagged (${msgs.length})</summary><ul>${msgs.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></details>` : ''}
  </div>`;
}

function renderIssueBody(details) {
  const body = details.querySelector('.issue-body');
  if (!body || body.dataset.ready) { if (body) body.hidden = !details.open; return; }
  const i = issueById[details.dataset.issue];
  const e = i.enrichmentHtml || {}; const r = i.ruleHtml || {};
  const tailored = '<span class="tailored">Written for this site</span>';
  const uid = i.id.replace(/[^\w-]/g, '');
  const fixTab = `
    <div class="block"><h3>What's wrong${e.explanation ? tailored : ''}</h3><div class="prose">${e.explanation || r.problem || `<p>${esc(i.description)}</p>`}</div>${contrastBlock(i)}</div>
    ${e.where ? `<div class="block"><h3>Where to fix it${tailored}</h3><div class="prose">${e.where}</div></div>` : ''}
    <div class="block"><h3>How to fix it${e.fix ? tailored : ''}</h3><div class="prose fix-prose">${e.fix || r.fix || `<p><a href="${esc(i.helpUrl)}" target="_blank" rel="noopener">Read the rule guidance</a></p>`}</div></div>
    ${(e.verify || r.verify) ? `<div class="block"><h3>How to check the fix</h3><div class="prose">${e.verify || r.verify}</div></div>` : ''}
    <div class="actions">
      <button type="button" class="btn small primary" data-gh="${i.id}">Copy as GitHub issue</button>
      <button type="button" class="btn small" data-link="${i.id}">Copy link</button>
      ${i.helpUrl ? `<a class="btn small ghost" href="${esc(i.helpUrl)}" target="_blank" rel="noopener">Rule documentation ${icon('external')}</a>` : ''}
    </div>`;
  const firstN = 6;
  const whereTab = `<p class="muted small" style="margin:0 0 18px">${plural(i.instanceCount, 'element')} on ${plural(i.pageCount, 'page')}. Elements are outlined in pink.</p>
    <div class="instances" data-instances>${i.instances.slice(0, firstN).map(instanceHtml).join('')}</div>
    ${i.instances.length > firstN ? `<div class="more-row"><button type="button" class="btn small" data-more="${i.id}" data-shown="${firstN}">Show ${Math.min(20, i.instances.length - firstN)} more of ${i.instances.length - firstN} remaining</button></div>` : ''}`;
  const guidanceParts = [
    r.who ? `<div class="block"><h3>Who it affects</h3><div class="prose">${r.who}</div></div>` : '',
    e.fix && r.fix ? `<div class="block"><h3>General guidance for this rule</h3><div class="prose">${r.problem || ''}${r.fix}</div></div>` : (!e.fix && r.problem && e.explanation ? `<div class="block"><h3>About this rule</h3><div class="prose">${r.problem}</div></div>` : ''),
    r.falsePositives ? `<div class="block"><h3>Could this be a false positive?</h3><div class="prose">${r.falsePositives}</div></div>` : '',
    r.references ? `<div class="block"><h3>References</h3><div class="prose">${r.references}</div></div>` : '',
  ].filter(Boolean);
  const tabs = [
    { key: 'fix', label: 'The fix', html: fixTab },
    { key: 'where', label: 'Where it happens', count: i.instanceCount, html: whereTab },
    ...(guidanceParts.length ? [{ key: 'guide', label: 'Guidance', html: guidanceParts.join('') }] : []),
  ];
  body.innerHTML = `${i.kind === 'review' ? verdictHtml(i) : ''}
    <div class="tablist" role="tablist" aria-label="Issue details">${tabs.map((t, n) => `<button type="button" role="tab" id="tab-${uid}-${t.key}" aria-selected="${n === 0}" aria-controls="panel-${uid}-${t.key}" tabindex="${n === 0 ? 0 : -1}">${t.label}${t.count ? `<span class="count">${t.count}</span>` : ''}</button>`).join('')}</div>
    ${tabs.map((t, n) => `<div class="tabpanel" role="tabpanel" id="panel-${uid}-${t.key}" aria-labelledby="tab-${uid}-${t.key}" tabindex="0"${n === 0 ? '' : ' hidden'}>${t.html}</div>`).join('')}`;
  pairCode(body);
  body.dataset.ready = '1';
  body.hidden = false;
  wire(body);
}
// Put a before block and the after block that follows it side by side.
function pairCode(root) {
  $$('figure.code-before', root).forEach((b) => {
    const a = b.nextElementSibling;
    if (!a || !a.matches('figure.code-after')) return;
    const pair = document.createElement('div'); pair.className = 'code-pair';
    b.replaceWith(pair); pair.append(b, a);
  });
}

function verdictHtml(i) {
  const v = verdicts[i.id] || '';
  const hint = i.enrichment?.verdict ? `<p class="hint">Suggested from the scan: <strong>${esc({ 'likely-issue': 'probably a real issue', 'likely-fine': 'probably fine', unsure: 'needs a closer look' }[i.enrichment.verdict] || i.enrichment.verdict)}</strong>.</p>` : '<p class="hint">Look at the evidence, then record what you decide. Saved in this browser.</p>';
  return `<div class="review-box">${hint}<fieldset class="verdict-ctl"><legend>Your verdict</legend><div class="seg">${[['issue', 'Real issue'], ['fine', 'Not an issue'], ['unsure', 'Unsure']].map(([k, l]) => `<label><input type="radio" name="verdict-${i.id}" value="${k}" data-verdict="${i.id}"${v === k ? ' checked' : ''}>${l}</label>`).join('')}</div></fieldset></div>`;
}

function renderIssues(arg, params) {
  const list = filterIssues(violations, params);
  const filtered = list.length !== violations.length;
  return `<div class="view-head"><h1 tabindex="-1">Issues</h1><p class="lede">One entry per root cause. Each groups every element that fails the same way, so one fix usually clears all of them.</p></div>
  ${violations.length ? filterBar('issues', params, violations) : ''}
  <p class="results-line" id="results-line"><span>${filtered ? `Showing ${list.length} of ${plural(violations.length, 'issue')}. <a href="#/issues">Clear filters</a>` : plural(violations.length, 'issue')}</span></p>
  ${list.length ? issueList(list, 'issues') : `<div class="empty">${icon(violations.length ? 'search' : 'pass')}<h2>${violations.length ? 'No issues match these filters' : 'No automated failures'}</h2><p>${violations.length ? 'Try removing a filter.' : 'Check the Needs review and Manual checklist sections next.'}</p></div>`}`;
}

function renderReview(arg, params) {
  const list = filterIssues(reviews, params);
  const decided = reviews.filter((i) => verdicts[i.id]).length;
  return `<div class="view-head"><h1 tabindex="-1">Needs review</h1><p class="lede">Automated tools could not decide these, usually because of complex backgrounds, hidden content or behavior that needs a person. Heuristic checks for keyboard focus and reflow also land here.</p>
  ${reviews.length ? `<div class="progress" style="margin-top:16px"><span>${decided} of ${reviews.length} decided</span><span class="track" aria-hidden="true"><span class="fill" style="width:${(decided / Math.max(1, reviews.length)) * 100}%"></span></span></div>` : ''}</div>
  ${reviews.length ? filterBar('review', params, reviews) : ''}
  <p class="results-line"><span>${list.length !== reviews.length ? `Showing ${list.length} of ${reviews.length}. <a href="#/review">Clear filters</a>` : plural(reviews.length, 'item')}</span></p>
  ${list.length ? issueList(list, 'review') : `<div class="empty">${icon('pass')}<h2>Nothing to review</h2><p>The scan could decide every result on its own.</p></div>`}`;
}

// ------------------------------------------------ pages
function renderPages(arg, params) {
  const sort = params.get('sort') || 'issues';
  const rows = [...R.pages].sort((a, b) => sort === 'url' ? a.url.localeCompare(b.url) : sort === 'instances' ? (b.counts?.instances || 0) - (a.counts?.instances || 0) : (b.counts?.violations || 0) - (a.counts?.violations || 0) || (b.counts?.instances || 0) - (a.counts?.instances || 0));
  const th = (key, label, num) => `<th scope="col"${num ? ' class="num"' : ''} aria-sort="${sort === key ? (key === 'url' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-sort="${key}">${label}${sort === key ? icon('chevron-down', 'icon') : ''}</button></th>`;
  const status = (p) => p.error ? `<span class="sev critical"><span class="dot critical" aria-hidden="true"></span>Not scanned</span>` : p.authWall ? `<span class="sev moderate"><span class="dot moderate" aria-hidden="true"></span>Login wall</span>` : p.counts?.violations ? `<span class="sev serious"><span class="dot serious" aria-hidden="true"></span>Has issues</span>` : `<span class="sev pass"><span class="dot pass" aria-hidden="true"></span>Passed</span>`;
  const skipped = R.skipped?.length ? `<details class="sub-details" style="margin-top:24px"><summary>${plural(R.skipped.length, 'URL')} found but not scanned</summary><ul class="prose small" style="max-width:none">${R.skipped.slice(0, 200).map((s) => `<li><code>${esc(pathOf(s.url))}</code> <span class="muted">${esc(s.reason)}</span></li>`).join('')}</ul></details>` : '';
  return `<div class="view-head"><h1 tabindex="-1">Pages</h1><p class="lede">${R.meta.mode === 'crawl' ? `Found by crawling from <a href="${esc(R.meta.startUrls[0])}" target="_blank" rel="noopener">${esc(R.meta.startUrls[0])}</a>. Pages that share a URL pattern were sampled rather than all scanned.` : 'The pages you listed.'}</p></div>
  <div class="table-wrap"><table>
    <caption class="sr-only">Scanned pages, sorted by ${esc(sort)}</caption>
    <thead><tr>${th('url', 'Page')}${th('issues', 'Issues', true)}${th('instances', 'Elements', true)}<th scope="col" class="num">To review</th><th scope="col">Status</th></tr></thead>
    <tbody>${rows.map((p) => `<tr><td class="page-cell"><a href="#/page/${p.id}">${esc(pageLabel(p))}</a>${pageLabel(p) !== pathOf(p.url) ? `<span class="url">${esc(pathOf(p.url))}</span>` : ''}</td><td class="num">${p.counts?.violations ?? '–'}</td><td class="num">${p.counts?.instances ?? '–'}</td><td class="num">${p.counts?.review ?? '–'}</td><td>${status(p)}</td></tr>`).join('')}</tbody>
  </table></div>${skipped}`;
}

function renderPage(id) {
  const p = pageById[id];
  if (!p) return `<div class="view-head"><h1 tabindex="-1">Page not found</h1></div><p><a href="#/pages">Back to pages</a></p>`;
  const mine = (list) => list.filter((i) => i.pages.includes(id));
  const row = (i) => `<li>${sev(i.impact)}<a href="#/issue/${i.id}">${esc(i.title)}</a><span class="n">${plural(i.instances.filter((x) => x.page === id).length, 'element')}</span></li>`;
  const v = mine(violations); const r = mine(reviews);
  const from = p.foundOn ? pageById[p.foundOn] : null;
  return `<div class="view-head"><p class="crumb"><a href="#/pages">All pages</a></p><h1 tabindex="-1">${esc(pageLabel(p))}</h1>
    <p class="meta"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>${from ? `${sep}<span>linked from <a href="#/page/${from.id}">${esc(pageLabel(from))}</a></span>` : ''}${p.status ? `${sep}<span>HTTP ${p.status}</span>` : ''}</p></div>
  ${p.narrative ? `<p class="narrative" style="margin-bottom:28px">${esc(p.narrative)}</p>` : ''}
  ${p.error ? `<p class="note">${icon('info')}<span>This page could not be scanned: ${esc(p.error)}</span></p>` : ''}
  ${p.note ? `<p class="note">${icon('info')}<span>${esc(p.note)}</span></p>` : ''}
  <div class="page-detail">
    <div>
      <section aria-labelledby="pv-h"><div class="section-head"><h2 id="pv-h">Issues on this page</h2><p>${plural(v.length, 'issue')}</p></div>
        ${v.length ? `<ul class="compact-issues">${v.map(row).join('')}</ul>` : `<div class="empty">${icon('pass')}<p>No automated failures on this page.</p></div>`}</section>
      ${r.length ? `<section aria-labelledby="pr-h"><div class="section-head"><h2 id="pr-h">Needs review</h2><p>${plural(r.length, 'item')}</p></div><ul class="compact-issues">${r.map(row).join('')}</ul></section>` : ''}
    </div>
    <aside class="page-shots" aria-label="Screenshots">
      ${p.screenshot ? `<figure><button type="button" class="shot-btn" data-shot="${esc(p.screenshot)}" data-caption="${esc(`${pageLabel(p)}, desktop`)}"><img src="${esc(p.screenshot)}" alt="Desktop screenshot of ${esc(pageLabel(p))}" loading="lazy"><span class="sr-only">Enlarge</span></button><figcaption>Desktop, full page</figcaption></figure>` : ''}
      ${p.mobileScreenshot ? `<figure><button type="button" class="shot-btn" data-shot="${esc(p.mobileScreenshot)}" data-caption="${esc(`${pageLabel(p)}, mobile`)}"><img src="${esc(p.mobileScreenshot)}" alt="Mobile screenshot of ${esc(pageLabel(p))}" loading="lazy"><span class="sr-only">Enlarge</span></button><figcaption>Mobile, first screen</figcaption></figure>` : ''}
    </aside>
  </div>`;
}

// ------------------------------------------------ checklist
function renderChecklist() {
  const principles = { 1: 'Perceivable', 2: 'Operable', 3: 'Understandable', 4: 'Robust' };
  const done = R.criteria.filter((c) => checklist[c.sc]?.result).length;
  const autoLine = (c) => {
    const parts = [];
    if (c.status === 'fail') parts.push(`<span class="state fail">Failing</span><a href="#/issues?sc=${c.sc}">${plural(c.failing.length, 'issue')}</a>`);
    else if (c.status === 'review') parts.push(`<span class="state review">Needs review</span><a href="#/review?sc=${c.sc}">${plural(c.review.length, 'item')}</a>`);
    else if (c.status === 'pass') parts.push(`<span class="state pass">Passed automated checks</span>`);
    else if (c.status === 'na') parts.push(`<span>Nothing to test on these pages</span>`);
    else parts.push(`<span>No automated check</span>`);
    parts.push(`<span>${{ full: 'Fully automated', partial: 'Partly automated', manual: 'Manual only' }[c.automation] || ''}</span>`);
    return parts.join(sep);
  };
  const block = (c) => {
    const st = checklist[c.sc] || {};
    const hasNote = Boolean(st.note);
    return `<li class="sc" id="sc-${c.sc}" tabindex="-1" aria-labelledby="sc-h-${c.sc}">
      <span class="scn" aria-hidden="true">${c.sc}</span>
      <h3 id="sc-h-${c.sc}"><a href="${esc(c.url)}" target="_blank" rel="noopener"><span class="sr-only">${c.sc} </span>${esc(c.name)}</a><span class="tag soft">Level ${c.level}</span>${c.since === '2.2' ? '<span class="tag soft">New in 2.2</span>' : ''}</h3>
      <p class="how">${esc(c.howToTest)}</p>
      <div class="auto">${autoLine(c)}</div>
      <div class="ctl">
        <fieldset class="verdict-ctl"><legend class="sr-only">Your result for ${c.sc}</legend><div class="seg">${[['pass', 'Pass'], ['fail', 'Fail'], ['na', 'N/A']].map(([k, l]) => `<label><input type="radio" name="sc-${c.sc}" value="${k}" data-sc="${c.sc}"${st.result === k ? ' checked' : ''}>${l}</label>`).join('')}</div></fieldset>
        <button type="button" class="btn small ghost" data-note-toggle="${c.sc}" aria-expanded="${hasNote}" aria-controls="note-${c.sc}">${hasNote ? 'Edit note' : 'Add note'}</button>
      </div>
      <label class="sr-only" for="note-${c.sc}">Notes for ${c.sc}</label><textarea id="note-${c.sc}" data-note="${c.sc}" rows="2" placeholder="Notes"${hasNote ? '' : ' hidden'}>${esc(st.note || '')}</textarea>
    </li>`;
  };
  return `<div class="view-head"><h1 tabindex="-1">Manual checklist</h1><p class="lede">Every ${esc(R.meta.standardLabel)} success criterion, with what the scan found and how to test the rest by hand. Your results are saved in this browser and can be exported from the Export menu.</p>
    <div class="progress" style="margin-top:16px"><span id="cl-progress">${done} of ${R.criteria.length} checked</span><span class="track" aria-hidden="true"><span class="fill" id="cl-fill" style="width:${(done / R.criteria.length) * 100}%"></span></span></div></div>
    ${Object.entries(principles).map(([n, name]) => {
      const list = R.criteria.filter((c) => c.sc.startsWith(`${n}.`));
      const d = list.filter((c) => checklist[c.sc]?.result).length;
      return `<div class="principle-head"><h2>${n}. ${name}</h2><p data-principle-progress="${n}">${d} of ${list.length} checked</p></div><ul class="sc-list">${list.map(block).join('')}</ul>`;
    }).join('')}`;
}

// ------------------------------------------------ wiring
function wire(root) {
  $$('details.issue', root).forEach((d) => d.addEventListener('toggle', () => {
    renderIssueBody(d);
    if (d.open) { const { view } = parseHash(); if (view === 'issues' || view === 'review' || view === 'issue') history.replaceState(null, '', `#/issue/${d.dataset.issue}`); }
  }));
  $$('[role="tablist"]', root).forEach((list) => {
    const tabs = $$('[role="tab"]', list);
    const select = (tab, focus = true) => {
      tabs.forEach((t) => { const on = t === tab; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; const p = document.getElementById(t.getAttribute('aria-controls')); if (p) p.hidden = !on; });
      if (focus) tab.focus();
    };
    tabs.forEach((t, n) => {
      t.addEventListener('click', () => select(t, false));
      t.addEventListener('keydown', (e) => {
        const k = e.key; let next = null;
        if (k === 'ArrowRight') next = tabs[(n + 1) % tabs.length]; else if (k === 'ArrowLeft') next = tabs[(n - 1 + tabs.length) % tabs.length]; else if (k === 'Home') next = tabs[0]; else if (k === 'End') next = tabs[tabs.length - 1];
        if (next) { e.preventDefault(); select(next); }
      });
    });
  });
  $$('form[data-filters]', root).forEach((form) => {
    const view = form.dataset.filters;
    const update = () => {
      const p = new URLSearchParams();
      const fd = new FormData(form);
      for (const [k, v] of fd.entries()) if (v && !(k === 'sort' && v === 'priority')) p.set(k, v);
      const imp = $$('[data-impact][aria-pressed="true"]', form).map((b) => b.dataset.impact);
      if (imp.length) p.set('impact', imp.join(','));
      setParams(view, p);
      const base = view === 'review' ? reviews : violations;
      const list = filterIssues(base, p);
      const holder = form.parentElement;
      const old = holder.querySelector('.issue-list, .empty');
      const html = list.length ? issueList(list, view) : `<div class="empty">${icon('search')}<h2>No matches</h2><p>Try removing a filter.</p></div>`;
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const node = tmp.firstElementChild;
      if (old) old.replaceWith(node); else holder.appendChild(node);
      wire(node);
      const line = form.nextElementSibling;
      if (line?.classList.contains('results-line')) line.innerHTML = `<span>${list.length !== base.length ? `Showing ${list.length} of ${base.length}. <a href="#/${view}">Clear filters</a>` : `${base.length} total`}</span>`;
      announce(`${list.length} of ${base.length} shown`);
    };
    let t; form.addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(update, e.target.type === 'search' ? 180 : 0); });
    $$('[data-impact]', form).forEach((b) => b.addEventListener('click', () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); update(); }));
  });
  $$('[data-sort]', root).forEach((b) => b.addEventListener('click', () => { const p = new URLSearchParams(); p.set('sort', b.dataset.sort); setParams('pages', p); route(); $(`[data-sort="${b.dataset.sort}"]`)?.focus(); }));
  $$('[data-verdict]', root).forEach((inp) => inp.addEventListener('change', () => { verdicts[inp.dataset.verdict] = inp.value; store.set('verdicts', verdicts); const decided = reviews.filter((i) => verdicts[i.id]).length; const pr = $('.progress span'); if (pr) pr.textContent = `${decided} of ${reviews.length} decided`; const f = $('.progress .fill'); if (f) f.style.width = `${(decided / reviews.length) * 100}%`; toast('Verdict saved'); }));
  $$('[data-sc]', root).forEach((inp) => inp.addEventListener('change', () => { checklist[inp.dataset.sc] = { ...(checklist[inp.dataset.sc] || {}), result: inp.value }; store.set('checklist', checklist); updateChecklistProgress(); }));
  $$('[data-note]', root).forEach((ta) => ta.addEventListener('input', () => { checklist[ta.dataset.note] = { ...(checklist[ta.dataset.note] || {}), note: ta.value }; store.set('checklist', checklist); }));
  $$('[data-note-toggle]', root).forEach((b) => b.addEventListener('click', () => { const ta = document.getElementById(`note-${b.dataset.noteToggle}`); const show = ta.hidden; ta.hidden = !show; b.setAttribute('aria-expanded', show); if (show) ta.focus(); else b.textContent = ta.value ? 'Edit note' : 'Add note'; }));
}
function updateChecklistProgress() {
  const done = R.criteria.filter((c) => checklist[c.sc]?.result).length;
  const el = $('#cl-progress'); if (el) el.textContent = `${done} of ${R.criteria.length} checked`;
  const f = $('#cl-fill'); if (f) f.style.width = `${(done / R.criteria.length) * 100}%`;
  $$('[data-principle-progress]').forEach((p) => { const n = p.dataset.principleProgress; const list = R.criteria.filter((c) => c.sc.startsWith(`${n}.`)); p.textContent = `${list.filter((c) => checklist[c.sc]?.result).length} of ${list.length} checked`; });
  $('#nav-checklist').textContent = `${done}/${R.criteria.length}`;
}

// Delegated clicks: copy buttons, screenshots, more instances, GitHub export.
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, a');
  if (!t) return;
  if (t.matches('[data-copy]')) { copyText(t.closest('figure').querySelector('code').textContent, 'Code copied'); return; }
  if (t.matches('[data-copy-text]')) { copyText(t.dataset.copyText, 'Copied'); return; }
  if (t.matches('[data-shot]')) { openViewer(t.dataset.shot, t.dataset.caption); return; }
  if (t.matches('[data-more]')) {
    const i = issueById[t.dataset.more]; const shown = +t.dataset.shown; const next = i.instances.slice(shown, shown + 20);
    const holder = t.closest('.tabpanel').querySelector('[data-instances]');
    holder.insertAdjacentHTML('beforeend', next.map(instanceHtml).join(''));
    const first = holder.children[shown]; if (first) { first.setAttribute('tabindex', '-1'); first.focus(); }
    const now = shown + next.length; t.dataset.shown = now;
    if (now >= i.instances.length) t.parentElement.remove(); else t.textContent = `Show ${Math.min(20, i.instances.length - now)} more of ${i.instances.length - now} remaining`;
    return;
  }
  if (t.matches('[data-gh]')) { copyText(githubIssue(issueById[t.dataset.gh]), 'GitHub issue copied'); return; }
  if (t.matches('[data-link]')) { copyText(`${location.href.split('#')[0]}#/issue/${t.dataset.link}`, 'Link copied'); return; }
  if (t.matches('[data-export]')) { doExport(t.dataset.export); $('#export-menu').open = false; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#export-menu').open) { $('#export-menu').open = false; $('#export-menu summary').focus(); } });
document.addEventListener('click', (e) => { const m = $('#export-menu'); if (m.open && !m.contains(e.target)) m.open = false; });

const viewer = $('#viewer');
function openViewer(src, caption) { const img = document.createElement('img'); img.src = src; img.alt = `Screenshot: ${caption}`; $('#viewer-body').replaceChildren(img); $('#viewer-caption').textContent = caption; $('#viewer-open').href = src; viewer.showModal(); }
$('#viewer-close').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });

// ------------------------------------------------ exports
function textOf(html) { const d = document.createElement('div'); d.innerHTML = html || ''; $$('figure.code', d).forEach((f) => { const lang = f.querySelector('.lang')?.textContent || ''; const label = f.querySelector('figcaption span')?.textContent || ''; f.replaceWith(`\n${/before|after/i.test(label) ? `${label}:\n` : ''}\`\`\`${lang.toLowerCase()}\n${f.querySelector('code').textContent}\n\`\`\`\n`); }); $$('li', d).forEach((li) => li.prepend('- ')); $$('p, li, ul, ol', d).forEach((el) => el.append('\n')); return d.textContent.replace(/\n{3,}/g, '\n\n').trim(); }
function githubIssue(i) {
  const e = i.enrichmentHtml || {}; const r = i.ruleHtml || {};
  const pagesList = i.pages.slice(0, 15).map((id) => `- ${pageById[id].url}`).join('\n');
  const examples = i.instances.slice(0, 3).map((x) => `- \`${x.target}\` on ${pageById[x.page].url}\n  \`\`\`html\n  ${x.html.replace(/\n/g, ' ')}\n  \`\`\``).join('\n');
  return `# A11y: ${i.title}

## Summary

${textOf(e.explanation || r.problem) || i.description}

**Impact:** ${IMPACT_LABEL[i.impact]} · **WCAG:** ${i.wcag.length ? i.wcag.map((sc) => `${sc} ${criterionBySc[sc]?.name || ''}`.trim()).join(', ') : 'best practice'} · **Rule:** \`${i.ruleId}\` · **Found:** ${plural(i.instanceCount, 'element')} on ${plural(i.pageCount, 'page')}

## Where

${pagesList}${i.pages.length > 15 ? `\n- …and ${i.pages.length - 15} more` : ''}

Examples:

${examples}

## How to fix

${textOf(e.fix || r.fix)}

## Acceptance Criteria

- [ ] All ${plural(i.instanceCount, 'listed element')} pass the \`${i.ruleId}\` check in a re-run of the audit
- [ ] ${textOf(e.verify || r.verify).split('\n')[0] || 'The fix is verified manually with a keyboard and a screen reader'}
`;
}
function doExport(kind) {
  const host = hostOf(R.meta.origin).replace(/[^\w.-]/g, '_');
  if (kind === 'json') {
    const strip = JSON.parse(JSON.stringify(R)); delete strip.narrativeHtml; strip.issues.forEach((i) => { delete i.ruleHtml; delete i.enrichmentHtml; }); strip.plan.forEach((p) => delete p.whyHtml);
    strip.reviewerVerdicts = verdicts; strip.manualChecklist = checklist;
    download(`a11y-${host}.json`, JSON.stringify(strip, null, 2), 'application/json');
  } else if (kind === 'csv') {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['issue_id', 'kind', 'impact', 'rule', 'wcag', 'title', 'page_url', 'viewports', 'selector', 'html', 'details'].join(',')];
    for (const i of R.issues) for (const x of i.instances) rows.push([i.id, i.kind, i.impact, i.ruleId, i.wcag.join(' '), i.title, pageById[x.page].url, x.viewports.join(' '), x.target, x.html, [...new Set(x.checks.map((c) => c.message))].join(' | ')].map(q).join(','));
    download(`a11y-${host}-instances.csv`, rows.join('\n'), 'text/csv');
  } else if (kind === 'md') {
    download(`a11y-${host}-issues.md`, violations.map(githubIssue).join('\n---\n\n'), 'text/markdown');
  } else if (kind === 'checklist') {
    const L = [`# ${R.meta.standardLabel} manual checklist: ${hostOf(R.meta.origin)}`, ''];
    for (const c of R.criteria) { const st = checklist[c.sc] || {}; L.push(`- [${st.result ? 'x' : ' '}] **${c.sc} ${c.name}** (${c.level}): ${st.result ? st.result.toUpperCase() : 'not checked'}; automated: ${c.status}${st.note ? `. Notes: ${st.note}` : ''}`); }
    download(`a11y-${host}-checklist.md`, L.join('\n'), 'text/markdown');
  }
  toast('Download started');
}

// ------------------------------------------------ boot
$('#brand-title').textContent = R.title;
$('#brand-sub').textContent = `${R.meta.standardLabel} · ${fmtDate(R.meta.startedAt)}`;
$('#nav-issues').textContent = violations.length;
$('#nav-pages').textContent = R.pages.length;
$('#nav-review').textContent = reviews.length;
updateChecklistProgress();
route();
})();
</script>
</body>
</html>
